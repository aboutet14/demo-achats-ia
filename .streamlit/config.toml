[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1F5A96"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#EAEFF5"
textColor = "#16243A"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Inter"
headingFontWeights = [800, 700, 650]
headingFontSizes = ["2.2rem", "1.45rem", "1.15rem"]
metricValueFontSize = "1.9rem"
metricValueFontWeight = 700
baseRadius = "0.7rem"
borderColor = "#DCE3EC"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#EEF3F9"
linkColor = "#1F5A96"
greenColor = "#1F8A5B"
redColor = "#C2413B"
orangeColor = "#C77A12"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4"]

[theme.sidebar]
backgroundColor = "#0F2A47"
secondaryBackgroundColor = "#1A3A5E"
textColor = "#E6EDF5"
primaryColor = "#F2B544"
borderColor = "#24486F"
